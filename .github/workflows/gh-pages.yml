name: Deploy static demo to GitHub Pages

# Pages source set to "GitHub Actions" in repo settings on 2026-09-24;
# this push also serves to trigger the first deployment run.
on:
  push:
    branches: [main]
    paths:
      - "static-demo/**"
      - "frontend/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancel it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Combine the static demo (site root, keeps the existing live URL
      # unchanged) with the standalone live-app frontend (published at
      # /app/, reachable as its own page) into one Pages artifact.
      - name: Assemble combined _site
        run: |
          mkdir -p _site/app
          cp -r static-demo/. _site/
          cp frontend/admin.html _site/app/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
