name: Deploy static demo to GitHub Pages

# Pages source set to "GitHub Actions" in repo settings on 2026-09-24;
# this push also serves to trigger the first deployment run.
on:
  push:
    branches: [main]
    paths:
      - "static-demo/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancel it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-demo

      - id: deployment
        uses: actions/deploy-pages@v4
