name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller --onefile --name datev-mock scripts/run_server.py

      # Split into small, individually-named steps -- every prior attempt
      # (backtick line-continuation fixed, repo "Workflow permissions"
      # confirmed set to read-and-write, multiple retries) failed at a
      # single combined "Create GitHub release" step with no diagnosable
      # error text reachable without an authenticated GitHub session. If
      # this still fails, whichever of these steps is red pinpoints the
      # actual cause from the step list alone, without needing raw logs.
      - name: Verify build output exists
        run: Get-ChildItem dist

      - name: Check gh CLI auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Create release (no assets yet)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}"

      - name: Upload exe asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/datev-mock.exe
