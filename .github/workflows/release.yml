name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller --onefile --name datev-mock scripts/run_server.py

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Single line, no PowerShell backtick line-continuation -- the
        # v0.1.0 run failed here silently (a trailing space after a
        # backtick breaks pwsh's continuation without a clear error),
        # confirmed via the GitHub API after the fact (this workflow had
        # never actually been checked for success, only the separate
        # GH Pages deploy had been).
        run: gh release create "${{ github.ref_name }}" dist/datev-mock.exe --title "${{ github.ref_name }}" --generate-release-notes
